# Pengaturan halaman admin Mula Bali (Sveltia CMS)
# >>> Ganti GANTI-USERNAME dengan nama akun GitHub Anda <<<
backend:
  name: github
  repo: GANTI-USERNAME/mulabali
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    update: "Update {{slug}} lewat admin"
    uploadMedia: "Upload foto {{path}}"
    deleteMedia: "Hapus foto {{path}}"

site_url: https://mulabalibamboovillas.com
display_url: https://mulabalibamboovillas.com
logo_url: /img/favicon.svg

media_folder: img
public_folder: /img

# Foto dari HP otomatis diperkecil & dikompres saat upload
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400

collections:
  - name: halaman
    label: "Isi Website"
    editor: { preview: false }
    files:

      # ---------------- KONTAK ----------------
      - name: kontak
        label: "Kontak, WhatsApp & Sosial Media"
        file: content/kontak.json
        fields:
          - label: "Nomor WhatsApp"
            name: whatsapp
            widget: string
            hint: "Boleh ditulis 0878..., +62 878... atau 62878.... Semua tombol WhatsApp di website ikut berubah."
          - { label: "Tombol WA melayang – teks kecil", name: wa_kicker, widget: string, required: false }
          - { label: "Tombol WA melayang – teks utama", name: wa_text, widget: string, required: false }
          - { label: "Email", name: email, widget: string, required: false }
          - label: "Sosial media"
            name: social
            widget: list
            summary: "{{fields.name}}"
            hint: "Yang link-nya kosong tidak ditampilkan."
            fields:
              - { label: "Nama (mis. Instagram, TikTok)", name: name, widget: string }
              - { label: "Link lengkap (https://...)", name: url, widget: string, required: false }

      # ---------------- BERANDA ----------------
      - name: beranda
        label: "Halaman Depan & Tentang Villa"
        file: content/beranda.json
        fields:
          - label: "Bagian paling atas (Hero)"
            name: hero
            widget: object
            fields:
              - { label: "Foto utama", name: image, widget: image }
              - { label: "Teks kecil di atas judul", name: kicker, widget: string }
              - { label: "Judul baris 1", name: title1, widget: string }
              - { label: "Judul baris 2", name: title2, widget: string }
              - { label: "Kalimat pembuka", name: subtitle, widget: text }
          - label: "Tentang villa (What is Mula Bali)"
            name: about
            widget: object
            fields:
              - { label: "Teks kecil", name: kicker, widget: string }
              - { label: "Judul", name: title, widget: string }
              - label: "Paragraf"
                name: paragraphs
                widget: list
                field: { label: "Paragraf", name: paragraph, widget: text }
              - label: "Angka-angka (mis. 2 Bedrooms)"
                name: stats
                widget: list
                summary: "{{fields.number}} {{fields.label}}"
                fields:
                  - { label: "Angka", name: number, widget: string }
                  - { label: "Keterangan", name: label, widget: string }
              - { label: "Jumlah tamu maksimal (untuk form booking)", name: max_guests, widget: number, value_type: int, min: 1, default: 4 }
              - label: "Foto slider"
                name: slides
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Foto", name: image, widget: image }
                  - { label: "Judul foto", name: caption, widget: string }
                  - { label: "Deskripsi foto (untuk Google & tunanetra)", name: alt, widget: string, required: false }
                  - &posisi
                    label: "Posisi potongan foto"
                    name: pos
                    widget: select
                    default: center
                    hint: "Bagian foto yang diutamakan bila foto terpotong."
                    options:
                      - { label: "Atas", value: "center 20%" }
                      - { label: "Agak atas", value: "center 30%" }
                      - { label: "Sedikit atas", value: "center 40%" }
                      - { label: "Tengah", value: "center" }
                      - { label: "Sedikit bawah", value: "center 60%" }
                      - { label: "Agak bawah", value: "center 70%" }
                      - { label: "Bawah", value: "center 80%" }

      # ---------------- GALERI ----------------
      - name: galeri
        label: "Galeri & Tour 360°"
        file: content/galeri.json
        fields:
          - { label: "Teks kecil", name: kicker, widget: string }
          - { label: "Judul galeri", name: title, widget: string }
          - { label: "Keterangan galeri", name: text, widget: text }
          - label: "Foto galeri"
            name: photos
            widget: list
            summary: "{{fields.caption}}"
            hint: "Seret untuk mengubah urutan."
            fields:
              - { label: "Foto", name: image, widget: image }
              - { label: "Judul foto", name: caption, widget: string }
              - { label: "Deskripsi foto (untuk Google & tunanetra)", name: alt, widget: string, required: false }
              - { label: "Foto tinggi (memanjang ke bawah)", name: tall, widget: boolean, default: false }
              - *posisi
          - label: "Tour 360°"
            name: tour
            widget: object
            fields:
              - { label: "Teks kecil", name: kicker, widget: string }
              - { label: "Judul", name: title, widget: string }
              - { label: "Keterangan", name: text, widget: text }
              - { label: "Foto panorama 360°", name: image, widget: image, hint: "Foto panorama melebar (rasio sekitar 2:1)." }

      # ---------------- HARGA ----------------
      - name: harga
        label: "Harga"
        file: content/harga.json
        fields:
          - { label: "Teks kecil", name: kicker, widget: string }
          - { label: "Judul", name: title, widget: string }
          - { label: "Keterangan", name: subtitle, widget: text }
          - label: "Paket standar"
            name: standard
            widget: object
            fields:
              - { label: "Nama paket", name: label, widget: string }
              - { label: "Lama menginap (teks)", name: nights, widget: string }
              - { label: "Harga per malam (angka saja, tanpa titik)", name: price, widget: number, value_type: int, required: false, hint: "Kosongkan untuk 'On request'." }
              - { label: "Foto", name: image, widget: image }
              - label: "Yang termasuk"
                name: features
                widget: list
                field: { label: "Poin", name: item, widget: string }
              - { label: "Teks tombol", name: button, widget: string }
          - label: "Paket long stay"
            name: long
            widget: object
            fields:
              - { label: "Nama paket", name: label, widget: string }
              - { label: "Lama menginap (teks)", name: nights, widget: string }
              - { label: "Minimal malam untuk harga long stay", name: min_nights, widget: number, value_type: int, min: 2, default: 3 }
              - { label: "Harga per malam (angka saja, tanpa titik)", name: price, widget: number, value_type: int, required: false, hint: "Kosongkan untuk 'On request'." }
              - { label: "Label pojok foto (mis. Best value)", name: badge, widget: string, required: false }
              - { label: "Foto", name: image, widget: image }
              - label: "Yang termasuk"
                name: features
                widget: list
                field: { label: "Poin", name: item, widget: string }
              - { label: "Teks tombol", name: button, widget: string }
          - { label: "Catatan di bawah harga", name: note, widget: text, required: false }

      # ---------------- ADD-ON ----------------
      - name: addon
        label: "Add-on (Add to your stay)"
        file: content/addon.json
        fields:
          - { label: "Teks kecil", name: kicker, widget: string }
          - { label: "Judul", name: title, widget: string }
          - { label: "Keterangan", name: subtitle, widget: text }
          - label: "Daftar add-on"
            name: addons
            widget: list
            summary: "{{fields.name}}"
            hint: "Tambah, hapus, atau seret untuk mengubah urutan."
            fields:
              - { label: "Nama", name: name, widget: string }
              - { label: "Deskripsi singkat", name: desc, widget: text }
              - { label: "Detail (muncul di pop-up)", name: detail, widget: text, required: false, hint: "Durasi, jam tersedia, apa saja yang termasuk." }
              - { label: "Harga (angka saja, tanpa titik)", name: price, widget: number, value_type: int, required: false, hint: "Kosongkan untuk 'On request'." }
              - { label: "Satuan harga (mis. per person, per trip)", name: unit, widget: string }
              - label: "Cara memilih"
                name: mode
                widget: select
                default: once
                options:
                  - { label: "Tombol Add (sekali per menginap)", value: once }
                  - { label: "Jumlah, maksimal = jumlah tamu", value: guest }
                  - { label: "Jumlah, dengan batas sendiri", value: qty }
              - { label: "Batas jumlah (hanya untuk 'batas sendiri')", name: max, widget: number, value_type: int, required: false, min: 1 }
              - { label: "Foto", name: image, widget: image }
              - *posisi

      # ---------------- BOOKING & LOKASI ----------------
      - name: booking
        label: "Cara Booking & Lokasi"
        file: content/booking.json
        fields:
          - { label: "Teks kecil", name: kicker, widget: string }
          - { label: "Judul", name: title, widget: string }
          - label: "Langkah booking"
            name: steps
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Judul langkah", name: title, widget: string }
              - { label: "Keterangan", name: text, widget: text }
          - label: "Link booking (Booking.com, Agoda, Airbnb, dll.)"
            name: platforms
            widget: list
            summary: "{{fields.name}}"
            hint: "Yang link-nya kosong tidak ditampilkan."
            fields:
              - { label: "Nama", name: name, widget: string }
              - { label: "Link lengkap (https://...)", name: url, widget: string, required: false }
          - { label: "Teks tombol WhatsApp", name: wa_button, widget: string }
          - label: "Lokasi"
            name: location
            widget: object
            fields:
              - { label: "Teks kecil", name: kicker, widget: string }
              - { label: "Judul", name: title, widget: string }
              - { label: "Keterangan", name: text, widget: text }
              - { label: "Alamat (Enter untuk baris baru)", name: address, widget: text }
              - { label: "Link Google Maps", name: maps_url, widget: string }
              - { label: "Pencarian peta (nama/alamat untuk peta di website)", name: map_search, widget: string }
